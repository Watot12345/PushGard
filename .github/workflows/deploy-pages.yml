name: Deploy PushGard Beta to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    name: Verify, Build Flutter Web & Deploy Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify canonical thresholds sync
        run: ./scripts/sync_thresholds.sh --check

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Flutter static analyzer
        working-directory: mobile
        run: flutter analyze

      - name: Run unit, widget & E2E beta tests
        working-directory: mobile
        run: flutter test

      - name: Build Flutter Web release bundle
        working-directory: mobile
        run: flutter build web --release

      - name: Assemble GitHub Pages site (Beta Hub + /app)
        run: |
          mkdir -p dist/gh-pages/app
          cp web-portal/index.html dist/gh-pages/index.html
          cp -r mobile/build/web/* dist/gh-pages/app/
          sed -i 's|<base href="/">|<base href="./">|g' dist/gh-pages/app/index.html
          touch dist/gh-pages/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/gh-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
