name: PushGard Laravel API Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'config/**'
      - 'fixtures/**'
      - '.github/workflows/server-tests.yml'
  pull_request:
    branches: [ main ]

jobs:
  laravel-tests:
    name: PHP 8.4 & Laravel Unit/Feature Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify canonical thresholds sync
        run: ./scripts/sync_thresholds.sh --check

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, pdo_pgsql, mbstring, xml, curl, zip

      - name: Install Composer dependencies
        working-directory: server
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment & run PHPUnit
        working-directory: server
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan test
